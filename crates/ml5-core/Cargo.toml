[package]
name = "ml5-core"
description = "CORe ML5 core engine: model management, backend abstraction, inference"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
cuda = ["safetensors", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
safetensors = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
bytes.workspace = true
dirs.workspace = true
async-trait = "0.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
sha2 = "0.10"
hex = "0.4"
zip = "8.6.0"
flate2 = "1.1.10"
tar = "0.4.46"
async-stream = "0.3.6"
urlencoding = "2"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.22", optional = true }
minijinja = { version = "2", optional = true, features = ["loop_controls", "json"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat", "datetime"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
