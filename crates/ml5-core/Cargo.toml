[package]
name = "ml5-core"
description = "CORe ML5 core engine: model management, backend abstraction, inference"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
gpu = ["llama-cpp-2/dynamic-backends", "llama-cpp-2/dynamic-link"]
vulkan = ["gpu"]
cuda = ["gpu", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cpu = []
safetensors = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
bytes.workspace = true
dirs.workspace = true
async-trait = "0.1"
llama-cpp-2 = "=0.1.157"
tokio-stream = { version = "0.1.19", features = ["sync"] }
encoding_rs = "0.8.42"
tokio-util = { version = "0.7.19", features = ["io"] }
indicatif = "0.18.6"
llama-cpp-sys-2 = "=0.1.157"
zip = "8.6.0"
flate2 = "1.1.10"
tar = "0.4.46"
async-stream = "0.3.6"
urlencoding = "2"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.22", optional = true }
