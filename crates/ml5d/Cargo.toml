[package]
name = "ml5d"
description = "CORe ML5 daemon: API server hosting native + OpenAI-compatible endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ml5d"
path = "src/main.rs"

[features]
default = []
safetensors = ["ml5-core/safetensors"]
cuda = ["ml5-core/cuda"]

[dependencies]
ml5-core = { path = "../ml5-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing-appender = "0.2.5"
async-stream = "0.3.6"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "winbase", "handleapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
