[package]
name = "ml5-installer"
description = "ML5 backend installers — one binary per backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ml5_installer"
path = "src/lib.rs"

[[bin]]
name = "ml5-installer-cuda"
path = "src/bin/cuda.rs"

[[bin]]
name = "ml5-installer-legacy-cuda"
path = "src/bin/legacy_cuda.rs"

[[bin]]
name = "ml5-installer-vulkan"
path = "src/bin/vulkan.rs"

[[bin]]
name = "ml5-installer-cpu"
path = "src/bin/cpu.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
reqwest.workspace = true
zip.workspace = true
dirs.workspace = true
sha2 = "0.10"
hex = "0.4"
flate2 = "1.1.10"
tar = "0.4.46"
indicatif = "0.17"
futures.workspace = true
