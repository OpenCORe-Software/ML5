name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --features safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-windows-x64
          path: |
            target/release/ml5.exe
            target/release/ml5d.exe
            target/release/ml5-installer-*.exe

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config libssl-dev
      - name: Build
        run: cargo build --release --features safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-linux-x64
          path: |
            target/release/ml5
            target/release/ml5d

  build-macos:
    name: macOS arm64
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --features safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-macos-arm64
          path: |
            target/release/ml5
            target/release/ml5d
