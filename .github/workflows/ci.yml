name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace --features ml5d/safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-windows-x64
          path: |
            target/release/ml5.exe
            target/release/ml5d.exe
            target/release/ml5-installer-*.exe

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - name: Build
        run: cargo build --release --workspace --features ml5d/safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-linux-x64
          path: |
            target/release/ml5
            target/release/ml5d

  build-macos:
    name: macOS arm64
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace --features ml5d/safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: ml5-macos-arm64
          path: |
            target/release/ml5
            target/release/ml5d

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists; skipping"
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.exists != 'true'
        with:
          pattern: ml5-*
          path: dist
      - name: Stage assets
        if: steps.gate.outputs.exists != 'true'
        run: |
          mkdir -p stage
          cp dist/ml5-windows-x64/* stage/
          cp dist/ml5-linux-x64/ml5 stage/ml5-linux
          cp dist/ml5-linux-x64/ml5d stage/ml5d-linux
          cp dist/ml5-macos-arm64/ml5 stage/ml5-macos
          cp dist/ml5-macos-arm64/ml5d stage/ml5d-macos
          ls -la stage
      - name: Extract release notes
        if: steps.gate.outputs.exists != 'true'
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          cat notes.md
      - name: Create release
        if: steps.gate.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "ML5 $TAG" --notes-file notes.md --target "${{ github.sha }}" stage/*
          else
            gh release create "$TAG" --title "ML5 $TAG" --generate-notes --target "${{ github.sha }}" stage/*
          fi
