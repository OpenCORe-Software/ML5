[workspace]
resolver = "2"
members = [
    "crates/ml5-core",
    "crates/ml5d",
    "crates/ml5",
    "crates/ml5-installer",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenCORe-Technologies/ML5"
homepage = "https://github.com/OpenCORe-Technologies/ML5"
authors = ["CORe Technologies"]
description = "Local GGUF inference with a Rust CLI, daemon, and OpenAI-compatible API"
keywords = ["llm", "inference", "gguf", "llama", "openai"]
categories = ["command-line-utilities", "network-programming", "science"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes = "1"
dirs = "6"
zip = "8.6.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
